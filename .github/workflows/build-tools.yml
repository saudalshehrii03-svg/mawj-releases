name: Build Mawj tools (Edit + HD + Audio)

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "apps/**"
      - ".github/workflows/build-tools.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A stable signing key so updates install over the previous version.
      # Uses the repository secrets when present, otherwise a CI-generated key kept in the Actions cache.
      - name: Restore signing key
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/cache@v4
        with:
          path: ~/mawj-signing.jks
          key: mawj-signing-v2

      - name: Prepare signing key
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            if [ ! -f "$HOME/mawj-signing.jks" ]; then
              keytool -genkeypair -keystore "$HOME/mawj-signing.jks" -alias mawj -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass mawjtools -keypass mawjtools -dname "CN=Mawj Tools"
            fi
            echo "SIGNING_KEYSTORE_PATH=$HOME/mawj-signing.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        working-directory: apps
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || 'mawjtools' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'mawj' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'mawjtools' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :editor:testDebugUnitTest assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp apps/hdupload/build/outputs/apk/release/*.apk "out/Mawj-HD-1.0.${VERSION_CODE}.apk"
          cp apps/audioextract/build/outputs/apk/release/*.apk "out/Mawj-Audio-1.0.${VERSION_CODE}.apk"
          cp apps/editor/build/outputs/apk/release/*.apk "out/Mawj-Edit-1.0.${VERSION_CODE}.apk"
          ls -la out

      - name: Signing certificate fingerprint (for Google sign-in setup)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          RAW=$("$BT/apksigner" verify --print-certs out/Mawj-Edit-*.apk | grep -m1 "SHA-1 digest" | awk '{print $NF}')
          SHA1=$(echo "$RAW" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "SHA-1: $SHA1"
          cat > notes.md <<NOTES
          **Mawj-Edit** — موج مونتاج: محرر فيديو (تقسيم، قص، سرعة، صوت، استخراج الصوت، انتقالات، فلاتر، نص، تصدير 4K، نسخ احتياطي على Google Drive).
          **Mawj-HD** — تصدير المقطع بجودة عالية (1080p / 2K / 4K) ورفعه على تيك توك.
          **Mawj-Audio** — تحويل أي مقطع إلى ملف صوتي (M4A أصلي بدون فقد / WAV / AAC).

          التثبيت: نزّل ملف الـ APK من الجوال ← افتحه ← اسمح بالتثبيت من مصادر غير معروفة.

          بصمة التوقيع SHA-1 (لإعداد تسجيل الدخول بجوجل): \`$SHA1\`
          NOTES
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: mawj-tools-apks
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tools-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "أدوات موج 1.0.${{ github.run_number }} — مونتاج + HD + صوت"
          body_path: notes.md
          files: out/*.apk
          # Never take over "Latest": the main Mawj app's updater relies on it.
          prerelease: true
          make_latest: "false"

      - name: Keep tools releases out of "Latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName | select(startswith("tools-v"))'); do
            gh release edit "$t" -R "$GITHUB_REPOSITORY" --prerelease --latest=false
          done

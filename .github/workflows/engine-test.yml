name: Editor engine tests (emulator)

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "apps/editor/**"
      - ".github/workflows/engine-test.yml"
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c || true
            cd apps && chmod +x gradlew && ./gradlew --no-daemon :editor:connectedDebugAndroidTest || (adb logcat -d > ../logcat.txt; exit 1)
            adb logcat -d > ../logcat.txt || true
      - name: Summarize logs
        if: always()
        run: |
          echo "=== Test results ==="; find apps/editor/build -name "*.xml" -path "*androidTest-results*" -exec grep -h -A3 "<failure" {} \; | head -80 || true
          echo "=== Relevant logcat ==="
          grep -E "MawjTest|AndroidRuntime|ExoPlayerImpl|Transformer|CompositionPlayer|ExportException|PlaybackException|E/Media|VideoFrameProcessor|GlUtil|E MediaCodec" logcat.txt | tail -150 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test-logs
          path: |
            logcat.txt
            apps/editor/build/outputs/androidTest-results
            apps/editor/build/reports/androidTests
